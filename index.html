<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Reda Ibrahim El-Sebaei — Trainer, Coach & M&E Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="site-fonts" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style id="site-style">
:root{--ink:#10204A;--deep:#0E6F80;--aqua:#3FD0E6;--paper:#F6F8FA;--card:#FFFFFF;--line:#DCE3EA;--muted:#57627A;--text:#1B2440;--on-ink:#FFFFFF;--on-ink-muted:#B9C4DA;
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#0A1530;--deep:#5CCFE0;--aqua:#3FD0E6;--paper:#0E1830;--card:#14213F;--line:#26365C;--muted:#A3AFC8;--text:#E8EDF7;--on-ink-muted:#A9B6D0}}
:root[data-theme="dark"]{--ink:#0A1530;--deep:#5CCFE0;--aqua:#3FD0E6;--paper:#0E1830;--card:#14213F;--line:#26365C;--muted:#A3AFC8;--text:#E8EDF7;--on-ink-muted:#A9B6D0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--aqua);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(30px,4.2vw,46px);font-weight:700}
h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
section{padding:96px 0}
.lede{color:var(--muted);font-size:19px;max-width:60ch}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:26px;height:26px;position:relative;flex:none}
.mark i{position:absolute;width:13px;height:13px}
.mark i:nth-child(1){left:0;top:0;background:var(--ink);border-radius:13px 0 0 0}
.mark i:nth-child(2){right:0;top:0;background:var(--aqua);border-radius:0 13px 0 0}
.mark i:nth-child(3){left:0;bottom:0;background:var(--aqua);border-radius:0 0 0 13px}
.mark i:nth-child(4){right:0;bottom:0;background:var(--ink);border-radius:0 0 13px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark i:nth-child(1),:root:not([data-theme="light"]) .mark i:nth-child(4){background:#7FA0E0}}
.nav ul{display:flex;gap:22px;list-style:none;margin:0 0 0 auto;padding:0;font-weight:500;font-size:15px}
.nav ul a{text-decoration:none;color:var(--muted)}.nav ul a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;font-family:var(--body)}
.btn.primary{background:var(--ink);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--aqua);color:#08142E}}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--text)}
@media (max-width:760px){.nav ul{display:none}.nav .btn{margin-left:auto;padding:9px 14px;font-size:14px;flex:none}}
.brand{min-width:0}.bn{overflow:hidden;text-overflow:ellipsis}

/* hero */
.hero{padding:72px 0 0;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;align-items:center}
.hero .role{font-weight:600;color:var(--deep);font-size:17px;margin-bottom:18px}
.hero h1{font-size:clamp(40px,6.2vw,76px);font-weight:800;letter-spacing:-.035em;line-height:.98}
.hero .tag{font-size:clamp(19px,2vw,22px);margin-top:24px;max-width:34ch;color:var(--text)}
.hero .note{color:var(--muted);margin-top:14px;font-size:16px;max-width:46ch}
.hero .actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.portrait{position:relative;aspect-ratio:1;max-width:440px;width:100%;justify-self:end}
.portrait .q{position:absolute;width:50%;height:50%}
.portrait .q1{left:0;top:0;background:var(--ink);border-radius:100% 0 0 0}
.portrait .q4{right:0;bottom:0;background:var(--aqua);border-radius:0 0 100% 0}
.portrait .ph{position:absolute;inset:9%;border-radius:50%;overflow:hidden;border:8px solid var(--paper);background:var(--line)}
.portrait .ph img{width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:72px;border-top:1px solid var(--line)}
.facts div{padding:26px 24px 30px 0;display:flex;gap:14px;align-items:baseline}
.facts div+div{padding-left:24px;border-left:1px solid var(--line)}
.facts b{font-family:var(--display);font-size:40px;font-weight:800;color:var(--deep);letter-spacing:-.03em;line-height:1}
.facts span{color:var(--muted);font-size:15px;line-height:1.35}
@media (max-width:860px){.hero .grid{grid-template-columns:1fr;gap:40px}.portrait{justify-self:start;max-width:300px;order:-1}.facts{grid-template-columns:1fr}.facts div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}.facts div{padding:18px 0}}

/* about */
.about .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px}
.about .text > div + div{margin-top:16px}
.exp3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:64px}
.exp3 > div{border-top:3px solid var(--aqua);padding-top:18px;position:relative}
.exp3 p{color:var(--muted);margin-top:8px;font-size:16px}
@media (max-width:860px){.about .grid,.exp3{grid-template-columns:1fr;gap:28px}}

/* services */
.services{background:var(--card);border-block:1px solid var(--line)}
.shead .lede{margin-top:12px}
.shead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.svc{display:grid;grid-template-columns:1fr 1.3fr 1.1fr;gap:32px;padding:30px 0;border-top:1px solid var(--line);position:relative}
.svc:last-of-type{border-bottom:1px solid var(--line)}
.svc h3{font-size:23px}
.svc .d{color:var(--text)}
.svc dl{margin:0;font-size:15px;color:var(--muted)}
.svc dt{font-weight:600;color:var(--deep);margin-top:0}
.svc dd{margin:2px 0 12px}
@media (max-width:860px){.svc{grid-template-columns:1fr;gap:12px}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:72px;counter-reset:s}
.steps > div{padding:0 22px 0 0;position:relative}
.steps .n{font-family:var(--display);font-weight:800;font-size:15px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;position:relative;z-index:1}
.steps > div::before{content:"";position:absolute;left:0;right:0;top:18px;height:2px;background:var(--line)}
.steps > div:last-child::before{right:auto;width:36px}
.steps h3{margin-top:16px}.steps p{color:var(--muted);font-size:15px;margin-top:6px;max-width:26ch}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr;row-gap:32px}.steps > div::before{display:none}}
.clients{margin-top:72px}
.clients h3{font-size:17px;color:var(--muted);font-family:var(--body);font-weight:600}
.clients ul{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.clients li{border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:15px;font-weight:500;position:relative;background:var(--paper)}

/* experience */
.tl{margin-top:48px;position:relative}
.job{display:grid;grid-template-columns:190px 1fr;gap:32px;padding:0 0 34px;position:relative}
.job .when{font-weight:600;color:var(--deep);font-size:15px;padding-top:3px;text-align:right}
.job .body{border-left:2px solid var(--line);padding-left:28px;position:relative}
.job .body::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--aqua)}
.job .org{color:var(--muted);font-size:15px;margin-top:4px}
.job ul{margin:10px 0 0;padding-left:18px}
.job li{margin-top:4px}
.job li::marker{color:var(--aqua)}
@media (max-width:760px){.job{grid-template-columns:1fr;gap:4px}.job .when{text-align:left;padding-left:30px}}

/* quals */
.quals{background:var(--card);border-block:1px solid var(--line)}
.q3{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:44px}
.q3 h3{font-size:18px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.q3 ul{list-style:none;padding:0;margin:0}
.q3 li{padding:6px 0;position:relative}
.q3 .edu b{display:block;font-weight:600}.q3 .edu span{color:var(--muted);font-size:15px}
.q3 .edu li{padding:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:6px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:15px}
@media (max-width:860px){.q3{grid-template-columns:1fr;gap:36px}}

/* contact */
.contact{background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden}
.contact .arc1,.contact .arc2{position:absolute;width:300px;height:300px;pointer-events:none}
.contact .arc1{right:-60px;top:-60px;background:var(--aqua);border-radius:0 0 0 100%;opacity:.9}
.contact .arc2{right:40px;bottom:-40px;width:150px;height:150px;border:22px solid #2C4F8F;border-radius:100% 0 0 0;border-right:0;border-bottom:0}
.contact h2{max-width:16ch;position:relative}
.contact .lede{color:var(--on-ink-muted);margin-top:18px}
.cgrid{display:grid;grid-template-columns:repeat(4,auto);gap:20px 48px;margin-top:48px;justify-content:start;position:relative}
.cgrid small{display:block;color:var(--on-ink-muted);font-size:14px}
.cgrid a,.cgrid span{font-weight:600;font-size:18px;text-decoration:none;word-break:break-word}
.cgrid a:hover{color:var(--aqua)}
@media (max-width:860px){.cgrid{grid-template-columns:1fr}.contact .arc2{display:none}}
footer{padding:28px 0;color:var(--muted);font-size:14px}

/* editing */
.ebar{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ebar .btn{box-shadow:0 6px 20px rgba(10,20,50,.25)}
.ebar .btn.light{background:var(--card);color:var(--text);border-color:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--paper);padding:10px 18px;border-radius:10px;font-size:15px;z-index:60;max-width:90vw}
body.editing [data-path]{outline:1.5px dashed color-mix(in srgb,var(--aqua) 70%,transparent);outline-offset:3px;border-radius:3px;cursor:text}
body.editing [data-path]:focus{outline:2px solid var(--aqua);background:color-mix(in srgb,var(--aqua) 10%,transparent)}
.x{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;border:0;background:#C93B3B;color:#fff;font-size:16px;line-height:1;cursor:pointer;z-index:3}
.add{display:inline-flex;margin-top:14px;border:1.5px dashed var(--deep);color:var(--deep);background:transparent;border-radius:8px;padding:7px 14px;font:600 14px var(--body);cursor:pointer}
.contact .add{border-color:var(--aqua);color:var(--aqua)}
.editbanner{background:var(--aqua);color:#08142E;text-align:center;font-size:14px;font-weight:600;padding:8px 16px}
li{position:relative}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

function setv(p,v){const k=p.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
const E=(p,tag='span',cls='')=>`<${tag}${cls?` class="${cls}"`:''} data-path="${p}">${esc(get(p))}</${tag}>`;
const X=p=>editing?`<button class="x" data-del="${p}" aria-label="Remove item" title="Remove">×</button>`:'';
const A=(p,l)=>editing?`<button class="add" data-add="${p}">+ ${l}</button>`:'';
const TPL={services:{t:"New service",d:"Describe what the service covers.",deliv:"What the client receives.",ideal:"Who it suits."},
 experience:{title:"Role title",org:"Organization, city",date:"2026 – Present",items:["What you did and the result."]},
 items:"New point",about:"New paragraph.",expertise:{t:"New area",d:"Short description."},process:{t:"Step",d:"What happens in this step."},
 clients:"Organization",education:{t:"Degree",s:"Institution, year"},certs:"New certification",skills:"New skill",languages:{l:"Language",v:"Level"},stats:{n:"0",l:"label"}};
const tel=s=>'tel:+2'+String(s).replace(/\D/g,'');

function render(){
 document.body.classList.toggle('editing',editing);
 const c=D.contact;
 app.innerHTML=`
${editing?`<div class="editbanner">${fileMode?'Editing — click any outlined text to change it. “Save & download” gives you the updated file.':'Editing — click any outlined text to change it. Save when you are done.'}</div>`:''}
<header class="nav"><div class="wrap">
 <a class="brand" href="#top"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="bn">${esc(D.name)}</span></a>
 <ul><li><a href="#about">About</a></li><li><a href="#services">Services</a></li><li><a href="#experience">Experience</a></li><li><a href="#qualifications">Qualifications</a></li></ul>
 <a class="btn primary" href="#contact">Get in touch</a>
</div></header>
<main id="top">
<section class="hero"><div class="wrap">
 <div class="grid">
  <div>
   ${E('role','p','role')}
   ${E('name','h1')}
   ${E('tagline','p','tag')}
   ${E('heroNote','p','note')}
   <div class="actions"><a class="btn primary" href="#services">See freelance services</a><a class="btn ghost" href="mailto:${esc(c.email)}">Email me</a></div>
  </div>
  <div class="portrait"><span class="q q1"></span><span class="q q4"></span><div class="ph"><img src="${esc(D.photo)}" alt="Portrait of ${esc(D.name)}"></div></div>
 </div>
 <div class="facts">${D.stats.map((s,i)=>`<div style="position:relative">${E('stats.'+i+'.n','b')}${E('stats.'+i+'.l','span')}${X('stats.'+i)}</div>`).join('')}</div>
</div></section>

<section class="about" id="about"><div class="wrap">
 <div class="grid">
  <div>${E('aboutTitle','h2')}</div>
  <div class="text">${D.about.map((p,i)=>`<div style="position:relative">${E('about.'+i,'p')}${X('about.'+i)}</div>`).join('')}${A('about','Add paragraph')}</div>
 </div>
 <div class="exp3">${D.expertise.map((x,i)=>`<div>${E('expertise.'+i+'.t','h3')}${E('expertise.'+i+'.d','p')}${X('expertise.'+i)}</div>`).join('')}</div>
 ${A('expertise','Add expertise')}
</div></section>

<section class="services" id="services"><div class="wrap">
 <div class="shead"><div><h2>Freelance services</h2>${E('servicesIntro','p','lede')}</div><a class="btn primary" href="#contact">Request a proposal</a></div>
 ${D.services.map((s,i)=>`<article class="svc">${E('services.'+i+'.t','h3')}${E('services.'+i+'.d','p','d')}<dl><dt>You receive</dt><dd>${E('services.'+i+'.deliv')}</dd><dt>Suits</dt><dd>${E('services.'+i+'.ideal')}</dd></dl>${X('services.'+i)}</article>`).join('')}
 ${A('services','Add service')}
 <h3 style="margin-top:80px;font-size:28px">How an assignment runs</h3>
 <div class="steps">${D.process.map((s,i)=>`<div><span class="n">${i+1}</span>${E('process.'+i+'.t','h3')}${E('process.'+i+'.d','p')}${X('process.'+i)}</div>`).join('')}</div>
 ${A('process','Add step')}
 <div class="clients"><h3>Organizations I have worked with</h3><ul>${D.clients.map((s,i)=>`<li>${E('clients.'+i)}${X('clients.'+i)}</li>`).join('')}</ul>${A('clients','Add organization')}</div>
</div></section>

<section id="experience"><div class="wrap">
 <h2>Experience</h2>
 <div class="tl">${D.experience.map((j,i)=>`<div class="job">${E('experience.'+i+'.date','div','when')}<div class="body">${E('experience.'+i+'.title','h3')}${E('experience.'+i+'.org','p','org')}<ul>${j.items.map((t,k)=>`<li>${E('experience.'+i+'.items.'+k)}${X('experience.'+i+'.items.'+k)}</li>`).join('')}</ul>${A('experience.'+i+'.items','Add point')}${X('experience.'+i)}</div></div>`).join('')}</div>
 ${A('experience','Add role')}
</div></section>

<section class="quals" id="qualifications"><div class="wrap">
 <h2>Qualifications</h2>
 <div class="q3">
  <div><h3>Education</h3><ul class="edu">${D.education.map((e,i)=>`<li>${E('education.'+i+'.t','b')}${E('education.'+i+'.s')}${X('education.'+i)}</li>`).join('')}</ul>${A('education','Add degree')}
   <h3 style="margin-top:32px">Languages</h3><ul class="edu">${D.languages.map((e,i)=>`<li>${E('languages.'+i+'.l','b')}${E('languages.'+i+'.v')}${X('languages.'+i)}</li>`).join('')}</ul>${A('languages','Add language')}</div>
  <div><h3>Training & certifications</h3><ul>${D.certs.map((s,i)=>`<li>${E('certs.'+i)}${X('certs.'+i)}</li>`).join('')}</ul>${A('certs','Add certification')}</div>
  <div><h3>Skills</h3><ul class="chips">${D.skills.map((s,i)=>`<li>${E('skills.'+i)}${X('skills.'+i)}</li>`).join('')}</ul>${A('skills','Add skill')}</div>
 </div>
</div></section>

<section class="contact" id="contact"><span class="arc1"></span><span class="arc2"></span><div class="wrap">
 ${E('ctaTitle','h2')}
 ${E('ctaText','p','lede')}
 <div class="cgrid">
  <div><small>Email</small>${editing?E('contact.email'):`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`}</div>
  <div><small>Mobile</small>${editing?E('contact.phone'):`<a href="${tel(c.phone)}">${esc(c.phone)}</a>`}${c.phone2||editing?`<br>${editing?E('contact.phone2'):`<a href="${tel(c.phone2)}">${esc(c.phone2)}</a>`}`:''}</div>
  <div><small>LinkedIn</small>${editing?E('contact.linkedin'):`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">View profile</a>`}</div>
  <div><small>Location</small>${E('contact.location')}</div>
 </div>
</div></section>
</main>
<footer><div class="wrap">© ${new Date().getFullYear()} ${esc(D.name)}</div></footer>
${canEdit?`<div class="ebar">${editing?`<button class="btn light" id="photoBtn">Change photo</button><button class="btn light" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">${fileMode?'Save & download':'Save changes'}</button>`:`<button class="btn primary" id="editBtn">Edit page</button>`}</div>`:''}`;
 if(editing){app.querySelectorAll('[data-path]').forEach(el=>{try{el.contentEditable='plaintext-only'}catch(e){el.contentEditable='true'}if(el.contentEditable!=='plaintext-only')el.contentEditable='true';el.spellcheck=true})}
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

app.addEventListener('input',e=>{const el=e.target.closest('[data-path]');if(!el)return;setv(el.dataset.path,el.innerText.replace(/\n+$/,''));dirty=true});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('[data-path]')){e.preventDefault();e.target.blur()}});
app.addEventListener('paste',e=>{const el=e.target.closest('[data-path]');if(!el||!editing)return;e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g,' ');document.execCommand('insertText',false,t)});
app.addEventListener('click',async e=>{
 if(editing&&e.target.closest('a')&&!e.target.closest('.ebar')){e.preventDefault()}
 const del=e.target.closest('[data-del]'),add=e.target.closest('[data-add]');
 if(del){const k=del.dataset.del.split('.');const i=+k.pop();get(k.join('.')).splice(i,1);dirty=true;render();return}
 if(add){const p=add.dataset.add;const key=p.split('.').pop();get(p).push(JSON.parse(JSON.stringify(TPL[key])));dirty=true;render();return}
 if(e.target.id==='editBtn'){editing=true;render();return}
 if(e.target.id==='cancelBtn'){if(dirty&&!confirm('Discard your changes?'))return;D=JSON.parse(saved);editing=false;dirty=false;render();return}
 if(e.target.id==='photoBtn'){pickPhoto();return}
 if(e.target.id==='saveBtn'){save(e.target)}
});

function pickPhoto(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height),cv=document.createElement('canvas');cv.width=cv.height=560;cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,560,560);D.photo=cv.toDataURL('image/jpeg',.86);dirty=true;render();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};inp.click()}

function buildDoc(){
 const json=JSON.stringify(D).replace(/</g,'\\u003c');
 const head='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(D.name)+' — Trainer, Coach & M&amp;E Specialist</title>\n<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+document.getElementById('site-fonts').outerHTML+'\n'+document.getElementById('site-style').outerHTML;
 return '<!doctype html>\n<html lang="en"><head>\n'+head+'\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="site-data">'+json+'<\/script>\n'+document.getElementById('site-script').outerHTML+'\n</body></html>';
}
async function save(btn){
 if(fileMode){
  const blob=new Blob([buildDoc()],{type:'text/html'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='reda-portfolio.html';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  saved=JSON.stringify(D);dirty=false;editing=false;render();
  toast('Downloaded the updated file. Replace the old reda-portfolio.html with it.');return}
 if(!art){toast('Saving is not available in this view.');return}
 btn.disabled=true;btn.textContent='Saving…';
 try{await art.publish(buildDoc());saved=JSON.stringify(D);dirty=false;editing=false;render();toast('Changes saved.')}
 catch(err){const code=err&&err.code;btn.disabled=false;btn.textContent='Save changes';
  if(code==='conflict')toast('Someone else saved a newer version, so the page will reload with theirs.');
  else if(code==='not_granted'||code==='not_writer')toast('You do not have permission to edit this page.');
  else toast('Could not save. Check your connection and try again.')}
}
document.addEventListener('keydown',e=>{if(fileMode&&(e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();canEdit=true;editing=true;render()}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

render();
(async()=>{try{if(!window.claude||!window.claude.use)return;art=await window.claude.use('artifact');if(!art)return;const u=await window.claude.use('user');canEdit=u?!!(await u.canEdit()):true;if(canEdit)render()}catch(e){}})();
})();
</script>
</body></html>
